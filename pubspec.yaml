name: viska
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.12
  flutter_rust_bridge: 2.13.0
  flutter_webrtc: ^1.6.2
  just_audio: ^0.10.6
  local_auth: ^2.3.0
  mobile_scanner: ^7.4.2
  mqtt_client: ^10.9.0
  nsd: ^5.0.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  qr_flutter: ^4.1.0
  record: ^6.2.1
  typed_data: ^1.4.0
  viska_core:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  permission_handler_platform_interface: ^4.4.1
  path_provider_platform_interface: ^2.1.3
  fake_async: ^1.3.3

# permission_handler_android 14.x tem um build.gradle.kts quebrado (bloco
# `kotlin { compilerOptions {} }` que não resolve com o AGP/Kotlin fixados em
# android/settings.gradle.kts — falha antes mesmo de chegar no código nativo).
# 13.0.1 é a última versão com build.gradle em Groovy, sem esse problema.
dependency_overrides:
  permission_handler_android: 13.0.1

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false

[workspace]
members = ["logic"]

[package]
name = "viska_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Fronteira FFI do Viska para o Flutter — casca fina em torno de viska_proto, gerada por flutter_rust_bridge."
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
viska_proto = { path = "logic" }
flutter_rust_bridge = "=2.13.0"

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

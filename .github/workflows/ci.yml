name: CI — Viska

on:
  push:
    branches: [ main, develop, developer ]
  pull_request:
    branches: [ main, develop, developer ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  rust-check:
    name: Núcleo Rust — Testes, Clippy e Features
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache de dependências Rust
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c  # v2.7.7
        with:
          workspaces: |
            rust -> rust/target

      - name: Instalar dependências nativas
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev

      - name: Testes do Núcleo
        working-directory: rust
        run: cargo test --workspace

      - name: Clippy (zero warnings)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Compilação com todas as features (GEMINI.md)
        working-directory: rust
        run: cargo build --all-features

      - name: Compilação sem features padrão (GEMINI.md)
        working-directory: rust
        run: cargo build --no-default-features

      - name: Compilar biblioteca nativa (cdylib)
        working-directory: rust
        run: cargo build

      - name: Upload da biblioteca nativa Rust (para testes E2E do Flutter)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: viska-core-linux-x64
          path: rust/target/debug/libviska_core.so
          retention-days: 1

  flutter-check:
    name: Flutter — Análise Estática e Testes
    needs: [rust-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Baixar biblioteca nativa Rust
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: viska-core-linux-x64
          path: rust/target/debug/

      - name: Configurar Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff  # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Obter dependências Flutter
        run: flutter pub get

      - name: Análise estática do Flutter
        run: flutter analyze

      - name: Testes do Flutter
        run: flutter test

  android-audit:
    name: Android — Build APK e Auditoria Zero Telemetria (D13 / F6)
    needs: [flutter-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Configurar Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165  # v5.0.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff  # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Rust para compilação FFI
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache de dependências Rust
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c  # v2.7.7
        with:
          workspaces: |
            rust -> rust/target

      - name: Obter dependências Flutter
        run: flutter pub get

      - name: Build do APK em modo Release
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Auditoria de Segurança e Zero Telemetria no APK
        run: |
          chmod +x scripts/audit_apk.sh
          ./scripts/audit_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Verificação de Integridade do APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "${APK_PATH}" ]; then
            echo "[-] Erro: APK não encontrado em ${APK_PATH}" >&2
            exit 1
          fi
          TAMANHO=$(stat -c%s "${APK_PATH}" 2>/dev/null || stat -f%z "${APK_PATH}")
          echo "[+] Tamanho do APK: ${TAMANHO} bytes"
          if [ "${TAMANHO}" -lt 5242880 ]; then
            echo "[-] Erro: Tamanho do APK suspeito ou corrompido (${TAMANHO} bytes, esperado > 5 MB)" >&2
            exit 1
          fi
          SHA256=$(sha256sum "${APK_PATH}" | awk '{print $1}')
          echo "[+] SHA256 do APK: ${SHA256}"

name: CI/CD iOS — Viska

on:
  push:
    branches: [ main, develop, developer ]
  pull_request:
    branches: [ main, develop, developer ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detectar alterações relevantes para iOS
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout em eventos push
      pull-requests: read # paths-filter consulta arquivos do PR via API
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout raso para diff de push
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Filtrar caminhos modificados
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'rust/**'
              - 'rust_builder/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/ios.yml'

  ios-build-check:
    name: Compilação iOS e Linkage Rust (No-Codesign)
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.changes.outputs.packages), 'ios') }}
    runs-on: macos-15
    timeout-minutes: 30
    cache-mode: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
    permissions:
      contents: read # checkout do código
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Adicionar alvo iOS ao Rust
        run: rustup target add aarch64-apple-ios

      - name: Cache de dependências Rust (Cargokit iOS)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rust -> ../build/ios/Build/Intermediates.noindex/Pods.build/Release-iphoneos/viska_core.build
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Configurar Ruby e Bundler
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Obter dependências Flutter
        run: flutter pub get --enforce-lockfile

      - name: Instalar CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Compilação do App iOS (Release sem assinatura)
        run: flutter build ios --no-codesign --release

      - name: Validar empacotamento em IPA sem assinatura
        run: |
          chmod +x scripts/package_ios_unsigned.sh
          ./scripts/package_ios_unsigned.sh build/ios/iphoneos/Runner.app build/ios/release_unsigned viska-ios-unsigned.ipa
          test -s build/ios/release_unsigned/viska-ios-unsigned.ipa

  ios-ok:
    name: Status consolidado iOS
    if: always()
    needs: [changes, ios-build-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Verificar resultado dos jobs de iOS
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

name: Releases Automatizadas (Android & iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nome customizado da tag (opcional, ex: v0.1.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Configurar Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165  # v5.0.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff  # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache de dependências Rust
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c  # v2.7.7
        with:
          workspaces: |
            rust -> rust/target

      - name: Obter dependências Flutter
        run: flutter pub get

      - name: Compilar APK (Release)
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Preparar artefato Android
        run: cp build/app/outputs/flutter-apk/app-release.apk viska-android.apk

      - name: Upload temporário do APK
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: android-release-apk
          path: viska-android.apk
          retention-days: 1

  build-ios:
    name: Compilar IPA iOS (Unsigned)
    runs-on: macos-14
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Configurar Rust e alvos iOS
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache de dependências Rust
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c  # v2.7.7
        with:
          workspaces: |
            rust -> rust/target

      - name: Configurar Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff  # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Desabilitar Swift Package Manager (garante uso do CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Configurar Ruby e CocoaPods
        uses: ruby/setup-ruby@277ba2a127aba66d45bad0fa2dc56f80dbfedffa  # v1.222.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Obter dependências Flutter
        run: flutter pub get

      - name: Instalar CocoaPods
        working-directory: ios
        run: bundle exec pod install --repo-update

      - name: Compilar App iOS (Release sem assinatura)
        run: flutter build ios --no-codesign --release

      - name: Empacotar Runner.app em IPA sem assinatura
        run: |
          chmod +x scripts/package_ios_unsigned.sh
          ./scripts/package_ios_unsigned.sh build/ios/iphoneos/Runner.app build/ios/release_unsigned viska-ios-unsigned.ipa
          cp build/ios/release_unsigned/viska-ios-unsigned.ipa viska-ios-unsigned.ipa

      - name: Upload temporário do IPA
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: ios-release-ipa
          path: viska-ios-unsigned.ipa
          retention-days: 1

  publish-release:
    name: Publicar Release no GitHub
    needs: [build-android, build-ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Baixar artefato Android
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: android-release-apk

      - name: Baixar artefato iOS
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: ios-release-ipa

      - name: Calcular somas de verificação SHA-256
        run: |
          sha256sum viska-android.apk viska-ios-unsigned.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determinar identificador da Tag
        id: tag_info
        env:
          TAG_INPUT: ${{ inputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            TAG="v${VERSION}"
            git fetch --tags || true
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              TAG="${TAG}-build.${{ github.run_number }}"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versão definida para a Release: ${TAG}"

      - name: Criar Release e Anexar Binários
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Viska ${{ steps.tag_info.outputs.tag }}
          files: |
            viska-android.apk
            viska-ios-unsigned.ipa
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Binários de Instalação / Installation Binaries

            ### 🤖 Android (`viska-android.apk`)
            - Arquivo APK compilado em modo Release e pronto para instalação direta.
            - Habilite a opção **"Instalar apps desconhecidos"** nas configurações de segurança do seu aparelho.

            ### 🍎 iOS (`viska-ios-unsigned.ipa`)
            - Arquivo `.ipa` sem assinatura para instalação via *sideloading*.
            - Utilize utilitários como **AltStore**, **Sideloadly**, **SideStore**, **Scarlet** ou **TrollStore** para assinar e instalar no iPhone.

            ### 🔒 Integridade (SHA-256)
            As somas criptográficas de verificação de cada binário estão no arquivo `SHA256SUMS.txt`.

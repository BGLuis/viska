name: Releases Automatizadas (Android & iOS)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nome customizado da tag (opcional, ex: v0.1.0)'
        required: false
        default: ''

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    cache-mode: none # release: nunca restaurar ou salvar cache em builds de release
    permissions:
      contents: read # checkout do código
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: false

      - name: Adicionar alvos Android ao Rust
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Obter dependências Flutter
        run: flutter pub get --enforce-lockfile

      - name: Compilar APK (Release)
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Auditoria de Segurança e Zero Telemetria no APK
        run: |
          chmod +x scripts/audit_apk.sh
          ./scripts/audit_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Preparar artefato Android
        run: cp build/app/outputs/flutter-apk/app-release.apk viska-android.apk

      - name: Upload temporário do APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-apk
          path: viska-android.apk
          retention-days: 1
          if-no-files-found: error

  build-ios:
    name: Compilar IPA iOS (Unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    cache-mode: none # release: nunca restaurar ou salvar cache em builds de release
    permissions:
      contents: read # checkout do código
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Adicionar alvo iOS ao Rust
        run: rustup target add aarch64-apple-ios

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: false

      - name: Configurar Ruby e CocoaPods
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.3'
          bundler-cache: false
          working-directory: ios

      - name: Instalar gems do CocoaPods
        working-directory: ios
        run: bundle install --jobs 4 --retry 3

      - name: Obter dependências Flutter
        run: flutter pub get --enforce-lockfile

      - name: Instalar CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Compilar App iOS (Release sem assinatura)
        run: flutter build ios --no-codesign --release

      - name: Empacotar Runner.app em IPA sem assinatura
        run: |
          chmod +x scripts/package_ios_unsigned.sh
          ./scripts/package_ios_unsigned.sh build/ios/iphoneos/Runner.app build/ios/release_unsigned viska-ios-unsigned.ipa
          cp build/ios/release_unsigned/viska-ios-unsigned.ipa viska-ios-unsigned.ipa

      - name: Upload temporário do IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-ipa
          path: viska-ios-unsigned.ipa
          retention-days: 1
          if-no-files-found: error

  publish-release:
    name: Publicar Release no GitHub
    needs: [build-android, build-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    cache-mode: none
    permissions:
      contents: write # criar release e anexar binários no GitHub
      id-token: write # assinar atestado SLSA de proveniência
      attestations: write # publicar atestado de proveniência dos binários
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Baixar artefato Android
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-apk

      - name: Baixar artefato iOS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-release-ipa

      - name: Calcular somas de verificação SHA-256
        run: |
          sha256sum viska-android.apk viska-ios-unsigned.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Atestar proveniência de build (SLSA Build L2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            viska-android.apk
            viska-ios-unsigned.ipa

      - name: Determinar identificador da Tag
        id: tag_info
        env:
          TAG_INPUT: ${{ inputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            TAG="v${VERSION}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              TAG="${TAG}-build.${RUN_NUMBER}"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versão definida para a Release: ${TAG}"

      - name: Criar Release e Anexar Binários
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag_info.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat << 'EOF' > "$NOTES_FILE"
          ## Binários de Instalação / Installation Binaries

          ### 🤖 Android (`viska-android.apk`)
          - Arquivo APK compilado em modo Release e pronto para instalação direta.
          - Habilite a opção **"Instalar apps desconhecidos"** nas configurações de segurança do seu aparelho.

          ### 🍎 iOS (`viska-ios-unsigned.ipa`)
          - Arquivo `.ipa` sem assinatura para instalação via *sideloading*.
          - Utilize utilitários como **AltStore**, **Sideloadly**, **SideStore**, **Scarlet** ou **TrollStore** para assinar e instalar no iPhone.

          ### 🔒 Integridade (SHA-256) e Proveniência (SLSA)
          As somas criptográficas de verificação de cada binário estão no arquivo `SHA256SUMS.txt`. A proveniência de compilação pode ser verificada com `gh attestation verify <arquivo> -R BGLuis/viska`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" viska-android.apk viska-ios-unsigned.ipa SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" viska-android.apk viska-ios-unsigned.ipa SHA256SUMS.txt \
              --target "$TARGET_SHA" \
              --title "Viska ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --generate-notes
          fi
